general:
  stop_time: 10s

network:
  graph:
    type: 1_gbit_switch

hosts:
  controller:
    network_node_id: 0
    processes:
    - path: ../bin/controller
      args: "-addr=controller:9000 -targetNodes=4"
      start_time: 0s
      expected_final_state: running

  peer0:
    network_node_id: 0
    processes:
    - path: ../bin/node
      args: "-id=0 -addr=peer0:8080 -controller=controller:9000"
      start_time: 1s
      expected_final_state: running
  
  peer1:
    network_node_id: 0
    processes:
    - path: ../bin/node
      args: "-id=1 -addr=peer1:8080 -controller=controller:9000"
      start_time: 1s
      expected_final_state: running

  peer2:
    network_node_id: 0
    processes:
    - path: ../bin/node
      args: "-id=2 -addr=peer2:8080 -controller=controller:9000"
      start_time: 1s
      expected_final_state: running

  peer3:
    network_node_id: 0
    processes:
    - path: ../bin/node
      args: "-id=3 -addr=peer3:8080 -controller=controller:9000"
      start_time: 1s
      expected_final_state: running
